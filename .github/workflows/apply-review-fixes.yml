name: Apply memory review fixes

on:
  push:
    branches:
      - agent/fix-host-overwrite-reuse

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-host-overwrite-reuse
          fetch-depth: 0

      - name: Address allocator and promotion review
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one literal for {label}, got {count}")
              return text.replace(old, new, 1)

          def replace_regex(text: str, pattern: str, new: str, label: str) -> str:
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"expected one regex replacement for {label}, got {count}")
              return updated

          spec_path = Path("spec/memory.md")
          spec = spec_path.read_text()

          spec = replace_once(
              spec,
              "Each region is a separate chain of fixed-size **1 MiB chunks** mapped from the OS on demand. A chunk belongs to exactly one region: fixed-size slots, dynamic backing stores, and anchor cells never coexist in the same chunk. A region maps no chunk until its first allocation. When its current chunk cannot satisfy an allocation, the runtime maps another chunk for that region, assigns it the next **chunk id**, and makes it current. Growing one region never copies or relocates allocations in another.",
              "Each region is a separate chain of fixed-size **1 MiB chunks** mapped from the OS on demand. A chunk belongs to exactly one region: fixed-size slots, dynamic backing stores, and anchor cells never coexist in the same chunk. A region maps no chunk until its first allocation. When its current chunk cannot satisfy an allocation, the runtime maps another chunk for that region, assigns it the next **chunk id**, and makes it current. Growing one region never copies or relocates allocations in another.\n\nAn ordinary allocation never straddles a chunk boundary. A dynamic block of at most 1 MiB is wholly contained in one dynamic chunk; if the remaining bytes in the current chunk cannot hold it, allocation continues in a fresh dynamic chunk. A dynamic block larger than 1 MiB is an **oversized span**: a dedicated contiguous OS mapping containing `block_size / 1 MiB` chunks, all belonging exclusively to that one block and assigned consecutive chunk ids. Its handle stores the segmented offset of the span's first byte and its size class; after resolving that base, element addressing uses an ordinary byte offset across the contiguous mapping. Every constituent chunk also has its own directory entry. Returning an oversized span pushes only its base offset onto the exact-size stack, and the whole span remains mapped for reuse until the scope drains.",
              "oversized dynamic span representation",
          )

          old_growth = """A list grows according to the following rules:

1. When its capacity is exhausted, the requested block size is exactly twice its current block size.
2. The allocator first checks the size stack for that doubled size. If a block is available, it is popped and the live elements are relocated into it.
3. If that stack is empty and the current backing store is the dynamic frontier allocation with enough contiguous room to double, the frontier is bumped by the additional bytes and the store grows in place.
4. Otherwise, the doubled block is allocated by bumping the dynamic frontier, mapping more dynamic chunks as needed, and the live elements are relocated into it.
5. After relocation, the handle's backing-store offset and size class are updated and the old block's offset is pushed onto the size stack for its old byte size.

Relocation moves or copies elements according to their type's ordinary move rules; the old block becomes reusable only after its previous occupants are no longer live. Guests to the list remain valid because they reach the list's host, whose fixed-size handle now names the current backing store.

Dynamic chunks and all power-of-two blocks begin at cache-line-aligned addresses. Because the minimum block is 128 bytes and every larger block doubles, both frontier allocations and reused blocks preserve cache-line alignment without mixing backing stores into fixed-size chunks."""
          new_growth = """A list grows according to the following rules:

1. When its capacity is exhausted, the requested block size is exactly twice its current block size.
2. The allocator first checks the size stack for that doubled size. If a block or oversized span is available, it is popped and the live elements are relocated into it.
3. If that stack is empty, the current backing store is the dynamic frontier allocation, the doubled size is at most 1 MiB, and the additional bytes fit before the current chunk boundary, the frontier is bumped and the store grows in place.
4. Otherwise, a doubled block of at most 1 MiB is bump-allocated wholly within one dynamic chunk. A doubled block larger than 1 MiB is allocated as a fresh dedicated oversized span (§3.1). The live elements are then relocated into the new block or span.
5. After relocation, the handle's backing-store offset and size class are updated and the old block's base offset is pushed onto the stack for its exact old byte size.

A block never grows in place across a chunk boundary, and an oversized span is never extended in place: further growth relocates into a doubled oversized span after checking that exact-size stack first. Relocation moves or copies elements according to their type's ordinary move rules; the old block becomes reusable only after its previous occupants are no longer live. Guests to the list remain valid because they reach the list's host, whose fixed-size handle now names the current backing store.

Dynamic chunks, ordinary power-of-two blocks, and oversized spans begin at cache-line-aligned addresses. Because the minimum block is 128 bytes and every larger block doubles, frontier allocations, reused blocks, and dedicated spans preserve cache-line alignment without mixing backing stores into fixed-size chunks."""
          spec = replace_once(spec, old_growth, new_growth, "list growth and oversized spans")

          new_anchor = """### 4.1 The anchor cell
Tethers are tracked through per-host **anchor cells** rather than one shared table. An anchor cell is a single **`u32`**. A canonical cell contains the current segmented offset (§3.1) of its hosted object in the fixed-size region. A source-scope cell left behind by promotion may instead contain the segmented offset of a newer anchor cell and acts as a **forwarding cell** (§4.5). The chunk directory records each chunk's region kind, so resolution distinguishes a payload target from a forwarding target without adding a tag to the cell.

Anchor storage is **scope-local**, never global. Each scope owns a dedicated anchor-cell region — a separate lazy chunk chain from both its fixed-size and dynamic regions. A scope that never creates a guest allocates no anchor chunk. The first tether to a host bump-allocates its canonical cell in that scope's anchor region (§4.3); promotion may allocate a replacement canonical cell in a destination scope and turn the previous cell into a forwarder (§4.5). No monolithic table is ever resized.

Keeping cells out of the other two streams preserves dense fixed-size layout and prevents dynamic-buffer history from affecting anchor placement. The region remains compact while live, and all of its chunks disappear with the scope in the same bulk unmap as the other regions.

> **Story:** [`stories/memory.md`](../stories/memory.md#where-the-cells-live-and-the-scan-that-pays-for-them) — "Where the cells live, and the scan that pays for them".

"""
          spec = replace_regex(
              spec,
              r"### 4\.1 The anchor cell\n.*?(?=### 4\.2 Tethers are segmented offsets, not pointers)",
              new_anchor,
              "anchor cell representation",
          )

          spec = replace_once(
              spec,
              "Every reference-type instance reserves a **`u32` backpointer** field, initialized to `0`; the first tether records the segmented offset of the instance's anchor cell there. The cell is allocated lazily (§4.3), whereas the backpointer field is always present in the layout, so object size is fixed and array layout stays uniform. The backpointer lets a host mint new tethers from the object — `&x` copies the offset — and lets a move locate and update the object's cell (§4.5). It is a single offset, not a list of tethers: the runtime never enumerates the tethers that point at the object, which is what keeps moves O(1) (§4.5).",
              "Every reference-type instance reserves a **`u32` backpointer** field, initialized to `0`; the first tether records the segmented offset of the instance's canonical anchor cell there. The cell is allocated lazily (§4.3), whereas the backpointer field is always present in the layout, so object size is fixed and array layout stays uniform. The backpointer always names the newest canonical cell, never a forwarding predecessor. It lets a host mint new tethers by copying that canonical offset and lets a move locate and update the one authoritative cell (§4.5). The runtime never enumerates the tethers or forwarding predecessors that ultimately reach it.",
              "canonical backpointer semantics",
          )
          spec = replace_once(
              spec,
              "A tethered reference-type instance therefore costs **12 bytes** across the whole chain: the 4-byte tether (wherever it is stored), the 4-byte anchor cell, and the 4-byte backpointer in the payload.",
              "The minimum machinery for one tethered reference-type instance is **12 bytes**: one 4-byte tether, one 4-byte canonical anchor cell, and the 4-byte backpointer in the payload. Each additional tether costs another 4 bytes. Each still-live source scope crossed by promotion may temporarily retain one additional 4-byte forwarding cell until that scope drains (§4.5).",
              "anchor cost accounting",
          )
          spec = replace_once(
              spec,
              "A hosted object that never gains a tether consumes no cell: its backpointer field stays `0` and no cell is allocated (it still carries the 4-byte field, §4.2). The first `&` taken on its host bump-allocates a cell in the arena, writes the hosted object's current segmented offset into it, and records the cell's own segmented offset in the object's backpointer. Every subsequent `&` from that host copies the backpointer.",
              "A hosted object that never gains a tether consumes no cell: its backpointer field stays `0` and no cell is allocated (it still carries the 4-byte field, §4.2). The first `&` taken on its host bump-allocates a canonical cell in the scope's anchor region, writes the hosted object's current segmented offset into it, and records the cell's own segmented offset in the object's backpointer. Every subsequent `&` from that host copies the canonical backpointer.",
              "lazy canonical anchor creation",
          )
          spec = replace_once(
              spec,
              "Resolving a tether reads the anchor cell it points at, reads the hosted object's segmented offset from that cell, materializes the object's address through the chunk directory (§3.1), then accesses the field. Because a cell is never at `0`, a resolution of an untethered `0` never reads a live cell.",
              "Resolving a tether reads the anchor cell it points at and inspects the region kind of the cell's target through the chunk directory (§3.1). A target in the fixed-size region is the hosted object's current location. A target in an anchor-cell region is a forwarding cell, so resolution repeats until it reaches the canonical cell whose target is the payload. It then materializes the object's address and accesses the field. Because a cell is never at `0`, a resolution of an untethered `0` never reads a live cell.",
              "forwarding-aware tether resolution",
          )
          spec = replace_once(
              spec,
              "The first segmented offset locates the anchor cell. The cell contains the\nsecond segmented offset, which locates the hosted object's current payload.\nBoth use the same chunk-directory resolution rule.",
              "The first segmented offset locates an anchor cell. In the common case that cell contains the second segmented offset, which locates the hosted object's current payload. After promotion it may instead locate another anchor cell; resolution follows such forwarding cells until a cell targets the fixed-size region. Every hop uses the same chunk-directory rule, whose region metadata distinguishes forwarding from payload targets.",
              "resolution walkthrough forwarding",
          )
          spec = replace_once(
              spec,
              "If the `Weapon` moves or its host is overwritten, the runtime updates only\nthe hosted object's offset stored in the anchor cell. `mainWeapon` continues\nto point at the same cell, and its next access reaches the payload's new location.",
              "If the `Weapon` moves or its host is overwritten, the runtime updates only the payload offset in its canonical anchor cell. `mainWeapon` may point directly at that cell or at a source-scope forwarding predecessor; either path reaches the canonical cell and therefore the payload's new location.",
              "canonical move resolution",
          )

          promotion_section = """### 4.5 Moves and overwrites update the canonical cell; promotion forwards the old cell
A tether follows an anchor path rather than pointing at a fixed object address. When a host is overwritten in place (§2.2) or its object moves within the same anchor scope, the runtime writes the payload's new segmented offset into the canonical anchor cell named by the payload's backpointer (§4.2). The cell itself does not move, so every tether that reaches it observes the hosted object's current location without per-tether fixup.

**Promotion** on escape (§3.5) cannot simply reset the backpointer and later mint an unrelated destination cell: source-scope tethers would keep using the old cell while later destination moves updated only the new one. Instead, promotion preserves one forwarding path:

1. If the payload's backpointer is `0`, promotion copies the payload with a `0` backpointer and allocates no cell.
2. Otherwise, let `old` be the canonical cell named by the source payload's backpointer. Promotion allocates `new` immediately in the destination scope's anchor-cell region.
3. The runtime writes the promoted payload's new fixed-size-region offset into `new`, writes `new`'s segmented offset into `old` (turning `old` into a forwarding cell), and writes `new`'s offset into the promoted payload's backpointer.
4. Existing source-scope tethers continue to point at `old` and resolve through it to `new`; destination-scope tethers minted after promotion point directly at `new`. Every later move or overwrite updates only `new`, the canonical cell, so both paths remain coherent.

Repeated promotions may form a short chain of one forwarding cell per still-live source scope. Each predecessor is owned by the scope whose tethers can point directly at it and is unmapped only when those tethers expire with that scope. Implementations may path-compress live forwarding cells to the newest canonical cell, but correctness does not depend on compression. Promotion is O(1) in the number of tethers and existing forwarding cells; tether resolution costs one additional dependent load for each uncompressed promotion boundary it crosses.

This is also how a moved-from symbol stays readable: after a move the symbol downgrades to an `&` — a segmented offset to its scope's cell — and reads follow any forwarding path to the value's current canonical cell (see [`lifetimes.md`](lifetimes.md) §1.6).

> **Story:** [`stories/memory.md`](../stories/memory.md#the-move-problem-and-the-anchor-that-never-moves) — "The move problem, and the anchor that never moves". [`stories/memory.md`](../stories/memory.md#where-the-cells-live-and-the-scan-that-pays-for-them) — "Where the cells live, and the scan that pays for them".

"""
          spec = replace_regex(
              spec,
              r"### 4\.5 Moves, overwrites, and promotion update one cell, not all tethers\n.*?(?=### 4\.6 Teardown releases cells in bulk)",
              promotion_section,
              "promotion forwarding algorithm",
          )
          spec = replace_once(
              spec,
              "Anchor cells are arena allocations, so they are never individually freed. When a scope drains, its chunks — payload and anchor-cell regions alike — are unmapped (§3.2) and its cells vanish together with the hosts and payloads they served.",
              "Anchor cells are arena allocations, so they are never individually freed. When a scope drains, its fixed-size, dynamic, and anchor-cell chunks are unmapped (§3.2). Canonical cells, forwarding cells, hosts, and backing stores owned by that scope vanish together.",
              "three-region teardown wording",
          )
          spec = replace_once(
              spec,
              "The genuine cost of any anchor scheme is **one extra dependent load per tether resolution** — the cell read — versus an idealized raw pointer that cannot survive moves. Because cells are packed together in the arena's compact anchor-cell region (§4.1), that load usually lands in hot, cache-resident memory, a few cycles at most. It is paid only when resolving a tether; direct access through a host never consults a cell. Across a run of accesses through the same tether with no intervening move, overwrite, or promotion, the compiler resolves the host address once and reuses it, so hot loops do not re-pay the load.",
              "The genuine base cost of the anchor scheme is **one extra dependent load per tether resolution** — the canonical cell read — versus an idealized raw pointer that cannot survive moves. An uncompressed forwarding cell left by promotion adds one dependent load for that promotion boundary. Cells are packed in compact scope-local anchor regions (§4.1), and implementations may path-compress forwarding cells, so these loads normally land in hot memory. They are paid only when resolving a tether; direct host access never consults a cell. Across repeated accesses with no intervening move, overwrite, or promotion, the compiler may resolve the host address once and reuse it.",
              "forwarding resolution cost",
          )
          spec_path.write_text(spec)

          story_path = Path("stories/memory.md")
          story = story_path.read_text()

          story = replace_once(
              story,
              "Growth doubles the block size. The allocator first looks for a reusable block of the doubled size. If none exists and the current buffer is the frontier allocation with room behind it, the frontier advances and the list grows in place. Otherwise a doubled block is bump-allocated at the frontier, the elements move, the handle changes its offset, and the old block is pushed onto its old-size stack. The free stack is therefore the first choice and the frontier the fallback — including the in-place case, which is just a frontier bump that happens not to change the address.",
              "Growth doubles the block size. The allocator first looks for a reusable block of the doubled size. If none exists and an ordinary buffer of at most 1 MiB is the frontier allocation with room before its chunk boundary, the frontier advances and the list grows in place. Otherwise the elements move into a new doubled block and the old block is pushed onto its old-size stack. The free stack is therefore the first choice and the frontier the fallback — including the in-place case, which is just a frontier bump that happens not to change the address.",
              "story ordinary growth",
          )
          story = replace_once(
              story,
              "This reintroduces size-class fragmentation, but only in the one region whose objects genuinely change size, with powers of two that match the doubling policy and a fixed 128-byte floor that maximizes cross-type reuse. The fixed-size and anchor regions retain the arena's strongest property: no free lists, no holes from reassignment, and one bulk unmap at scope drain. The arena did not abolish free stacks everywhere; it confined them to the place where their reuse is worth their fragmentation.",
              "An ordinary block never crosses a 1 MiB chunk boundary. Once doubling asks for more than one chunk, the allocator uses a dedicated contiguous oversized span whose constituent chunks belong only to that block. The handle still names one base segmented offset; the size class tells the runtime how many consecutive chunks the span contains, and indexing proceeds from the resolved contiguous base. Oversized spans are also reused from their exact-size stack first, but they are never extended in place — growth relocates into a doubled span.\n\nThis reintroduces size-class fragmentation, but only in the one region whose objects genuinely change size, with powers of two that match the doubling policy and a fixed 128-byte floor that maximizes cross-type reuse. The fixed-size and anchor regions retain the arena's strongest property: no free lists, no holes from reassignment, and one bulk unmap at scope drain. The arena did not abolish free stacks everywhere; it confined them to the place where their reuse is worth their fragmentation.",
              "story oversized spans",
          )
          story = replace_once(
              story,
              "What falls out is a memory model that is uniformly 32-bit and, per tethered object, exactly twelve bytes of machinery: the four-byte tether wherever it is stored, the four-byte anchor cell, and the four-byte backpointer the payload carries home to that cell. The double indirection a tether walks — tether to cell, cell to payload — looks like it should cost two cache misses, and the arena is what makes it cost closer to zero: the cell read is a load into arena memory that is almost always already warm. The first thing we tried for that warmth was to drop each cell right beside the payload that mints it, so the two share a cache line and the second hop is paid for by the first. It worked for the deref, and it opened a loose end the next chapter has to pull on — a cell sitting in the payload stream is a cell a payload-only scan has to step over, and a payload's position starts to depend on how many of its neighbours were tethered before it.",
              "What falls out is a memory model whose links are uniformly 32-bit. The minimum tethered case is twelve bytes of machinery — one four-byte tether, one four-byte canonical cell, and the four-byte backpointer the payload carries home to that cell — with four bytes for each additional tether. Promotion may temporarily add one four-byte forwarding cell in each still-live source scope. The usual double indirection — tether to canonical cell, cell to payload — stays compact; a forwarding boundary adds another hot cell read. The first thing we tried for that warmth was to drop each cell right beside the payload that mints it, so the two share a cache line and the second hop is paid for by the first. It worked for the deref, and it opened a loose end the next chapter has to pull on — a cell sitting in the payload stream is a cell a payload-only scan has to step over, and a payload's position starts to depend on how many of its neighbours were tethered before it.",
              "story anchor cost",
          )
          story = replace_once(
              story,
              "The one motion this has to survive is escape. A value that outlives its scope is moved into a parent, and under arenas that means its payload is *copied* into the parent's arena — the child arena is about to be unmapped and cannot keep it. The backpointer is what makes that copy invisible: the runtime follows it to the payload's one anchor cell and rewrites the cell with the payload's new location. Every tether still points at that same cell and never learns the payload moved ([`memory.md` §4.5](https://github.com/zane-lang/spec/blob/dc33d1eae46bfc71bfb7e8e3b2f575926aa00059/spec/memory.md#45-moves-overwrites-and-promotion-update-one-cell-not-all-tethers)) — the same one-cell-update that made an in-place move O(1) makes a cross-arena promotion O(1) too. When the scope finally drains, its chunks are unmapped and its cells vanish with the objects they served, and the scope rules that governed tethers all along guarantee nothing still pointing could point into them.",
              "The one motion this has to survive is escape. A value that outlives its scope is copied into a parent arena, but its source-scope tethers may remain live until the child scope drains. Promotion therefore allocates a new canonical cell in the destination scope, points it at the promoted payload, turns the old canonical cell into a forwarder to the new one, and records the new cell in the payload's backpointer ([`memory.md` §4.5](../spec/memory.md#45-moves-and-overwrites-update-the-canonical-cell-promotion-forwards-the-old-cell)). Old tethers follow the forwarding cell; new tethers point directly at the destination cell; later moves update only that canonical cell and both paths stay current. Promotion remains O(1) in the number of tethers, while each live promotion boundary can add one dependent cell load until its source scope drains.",
              "story promotion overview",
          )
          story = replace_once(
              story,
              "The cost is real and we name it plainly. We gave up the shared-cache-line bonus on the deref itself — the cell and its payload no longer ride into cache together, so a single tether resolution can pay two loads where the interleaved layout often paid one. We judged that the right trade because the payload sweep is the hotter path in the workloads we cared about: densifying the scan that runs over every object beats shaving a load off the deref that runs only when a tether is actually followed. It is the mirror image of the choice the last chapter made, now that we have measured which side of the coin comes up more often.",
              "The cost is real and we name it plainly. We gave up the shared-cache-line bonus on the deref itself — the cell and its payload no longer ride into cache together, so the common tether resolution pays the canonical cell load, and an uncompressed promotion boundary adds another. We judged that the right trade because the payload sweep is the hotter path in the workloads we cared about, and forwarding appears only when a tethered value crosses scopes. Dense scans beat permanently interleaving metadata, while implementations remain free to path-compress the uncommon forwarding chain.",
              "story forwarding cost",
          )
          story = replace_once(
              story,
              "Separating the region also forced us to finish a sentence the last chapter had left dangling. It had described promotion as \"rewrite the one cell and every tether follows,\" which quietly skipped the question of *which arena that cell is in*. Now the answer is unambiguous: the cell lives in the region of the scope that minted it, and on escape that scope is precisely the one about to drain. Every tether already pointing at the cell was taken in that scope or deeper, so none of them outlives it — the lifetime rule that has fenced tethers all along ([`lifetimes.md` §1.1](https://github.com/zane-lang/spec/blob/93bd2f0036b011c9fc876e785bff0d6a4d09465a/spec/lifetimes.md#11--assignment-uses-owner-scope)) does the fencing here too. So promotion updates the old cell to the payload's new home, keeping those doomed-but-still-live tethers reading the promoted copy until their scope ends, and then **resets the payload's backpointer to zero** so the value re-anchors from scratch in its new scope: the next tether taken on it there mints a fresh cell in the destination region, one that finally lives as long as the value does ([`memory.md` §4.5](https://github.com/zane-lang/spec/blob/2caab48a9f4bafda32d67c3bb902908aea1813ab/spec/memory.md#45-moves-overwrites-and-promotion-update-one-cell-not-all-tethers)). The old cell and its tethers expire together when the source scope drains, and nothing ever reads a cell that has been unmapped. That reset is the honest tax of keeping cells scope-local rather than in one immortal table — a second, cheaper re-anchoring the immortal table would not have needed, paid so that anchors can vanish in the same unmap as everything else.",
              "Separating the region also forced us to finish a sentence the last chapter had left dangling. The source cell cannot simply be repointed at the payload and forgotten while the destination later mints an unrelated cell: with only one payload backpointer, a subsequent move would update the destination cell and leave the source path stale. Promotion therefore creates the destination cell immediately. The new cell becomes canonical and points at the promoted payload; the old source cell is rewritten to point at the new cell; and the payload's backpointer is changed to the new cell ([`memory.md` §4.5](../spec/memory.md#45-moves-and-overwrites-update-the-canonical-cell-promotion-forwards-the-old-cell)). Region metadata in the chunk directory tells resolution whether a cell points at a payload or forwards to another cell.\n\nThat gives each scope exactly the path it needs. Existing source tethers keep their old four-byte identity and follow it across the promotion boundary, while destination tethers are minted from the new canonical backpointer. Later moves and overwrites touch only the canonical cell, and every predecessor still leads there. Repeated promotions can form a short chain, one cell per still-live source scope; those cells and the tethers that can name them expire together as their scopes drain, and an implementation may path-compress the chain. The price of scope-local anchors is therefore an occasional extra dependent load, not a stale path or a list of tethers to rewrite.",
              "story normative promotion rationale",
          )
          story_path.write_text(story)
          PY

      - name: Commit review fixes
        shell: bash
        run: |
          rm .github/workflows/apply-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/memory.md stories/memory.md .github/workflows/apply-review-fixes.yml
          git commit -m "Address allocator and promotion review"
          git push

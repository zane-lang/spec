# Publishes the committed benchmark pages: site/index.html at the root, and
# each bench's rendered page beneath it. It deploys them as rendered, and
# never runs a harness: each page shows its pinned run, and a CI runner is
# not a machine a run is pinned from.
name: bench-pages

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "memorybench/benchmark.html"
      - "langbench/langbench.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage the page
        run: |
          mkdir -p _site/memorybench _site/langbench
          cp site/index.html _site/index.html
          cp memorybench/benchmark.html _site/memorybench/index.html
          cp langbench/langbench.html _site/langbench/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/memory.md spec/lifetimes.md spec/glossary.md stories/memory.md .github/workflows/tmp-forwarding-anchor-update.yml
          git commit -m "Specify forwarding anchors for merged identities"

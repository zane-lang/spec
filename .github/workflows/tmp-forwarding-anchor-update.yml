name: Temporary forwarding-anchor update

on:
  push:
    branches:
      - agent/fix-host-overwrite-reuse

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-host-overwrite-reuse

      - name: Update forwarding-anchor specification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          replace_once(
              "spec/memory.md",
              "Anchors do not belong to any scope arena. The runtime owns one **global anchor pool**, implemented as a lazy chain of anchor-only 1 MiB pages. Every anchor occupies an **8-byte-aligned, 8-byte physical slot**: the first four bytes hold the `u32` payload offset and the remaining four bytes are reserved padding. An anchor page therefore contains 131072 addressable slots. The pool maps its first page only when the program creates its first guest and adds another page only when its current frontier and free-address stack cannot satisfy an allocation.",
              "Anchors do not belong to any scope arena. The runtime owns one **global anchor pool**, implemented as a lazy chain of anchor-only 1 MiB pages. Every anchor occupies an **8-byte-aligned, 8-byte physical slot**: the first four bytes hold a `u32` target segmented offset and the remaining four bytes identify whether that target is a hosted payload or another anchor. An anchor page therefore contains 131072 addressable slots. The pool maps its first page only when the program creates its first guest and adds another page only when its current frontier and free-address stack cannot satisfy an allocation."
          )

          replace_once(
              "spec/memory.md",
              "When a reference-type instance is rehosted, all storage owned by that host is relocated into storage owned by the destination. Its statically sized inline bytes are copied into the destination host's fixed-size slot (§3.7). For every dynamic backing store, the runtime allocates an equal-size block or oversized span in the destination scope's dynamic region, relocates the live contents into it according to their ordinary move rules, updates the copied handle, and then returns the old source block or span to its exact-size stack. Anchored reference-type values hosted inside a relocated backing store update their own canonical anchor cells as their host locations change. A promotion therefore completes before the source scope may drain and leaves no destination handle pointing into source-scope memory.",
              "When a reference-type instance is rehosted, all storage owned by that host is relocated into storage owned by the destination. Its statically sized inline bytes are copied into the destination host's fixed-size slot (§3.7). For every dynamic backing store, the runtime allocates an equal-size block or oversized span in the destination scope's dynamic region, relocates the live contents into it according to their ordinary move rules, updates the copied handle, and then returns the old source block or span to its exact-size stack. Anchored reference-type values hosted inside a relocated backing store update their terminal payload anchors or install forwarding anchors as their host locations and identities merge. A promotion therefore completes before the source scope may drain and leaves no destination handle pointing into source-scope memory."
          )

          replace_once(
              "spec/memory.md",
              "Moves only ever target the same or a higher scope ([`lifetimes.md`](lifetimes.md) §1.4), so the destination always outlives the source and its slot already exists. Rehosting copies the complete hosted representation into destination-owned storage. The inline payload or handle is copied into the destination's fixed-size slot. Each dynamic backing store is relocated into an equal-size destination-region block or oversized span as specified in §3.5; after its live contents and any contained anchor locations have been updated, the old store is returned to the source scope's exact-size stack. The source payload bytes then cease to be live. Its host-capable slot is rewritten into guest state and stores the canonical tether; the rest of that full-size slot is dead until the slot is overwritten or its scope drains. If the moved value is tethered, the destination inherits the same global anchor identity and updates its one cell (§4.5), never the tethers themselves.",
              "Moves only ever target the same or a higher scope ([`lifetimes.md`](lifetimes.md) §1.4), so the destination always outlives the source and its slot already exists. Rehosting copies the complete hosted representation into destination-owned storage. The inline payload or handle is copied into the destination's fixed-size slot. Each dynamic backing store is relocated into an equal-size destination-region block or oversized span as specified in §3.5; after its live contents and any contained anchor locations have been updated, the old store is returned to the source scope's exact-size stack. The source payload bytes then cease to be live. Its host-capable slot is rewritten into guest state and stores a tether to the destination's terminal anchor; the rest of that full-size slot is dead until the slot is overwritten or its scope drains. Existing source guests continue through the source anchor, which either becomes the destination's payload anchor or forwards to the destination's existing anchor (§4.5); no guest is enumerated or rewritten."
          )

          replace_once(
              "spec/memory.md",
              "Tethers are tracked through **anchor cells** in one runtime-global pool. An anchor cell has a 4-byte logical `u32` payload holding the current segmented offset (§3.1) of a hosted reference-type value, but occupies one 8-byte-aligned physical slot so every cell identity is representable by the shared 8-byte-word offset encoding. The cell's own segmented offset is the stable anchor identity for the complete hosting lineage, even when the value is rehosted across scopes.",
              "Tethers are tracked through **anchor cells** in one runtime-global pool. An anchor cell occupies one 8-byte-aligned physical slot so every cell identity is representable by the shared 8-byte-word offset encoding. Its first `u32` is a segmented target offset; its second `u32` identifies the target as either a hosted payload or another anchor. A payload anchor is the terminal identity stored in the hosted payload's backpointer. A forwarding anchor preserves an older guest identity after two hosting lineages merge, without changing any existing tether."
          )

          replace_once(
              "spec/memory.md",
              "Every reference-type payload reserves a `u32` backpointer field initialized to `0`. Once an anchor exists, that field stores the same stable anchor identity that its guests store. Guests and backpointers never store the payload address directly.",
              "Every reference-type payload reserves a `u32` backpointer field initialized to `0`. Once an anchor exists, that field stores the terminal payload-anchor identity. Guests may store either that terminal identity or an older identity that forwards to it. Neither guests nor backpointers store the payload address directly."
          )

          replace_once(
              "spec/memory.md",
              "The minimum physical footprint attributable to one tethered hosting lineage is **16 bytes**: one 4-byte tether, one 8-byte physical anchor slot (containing a 4-byte cell payload), and one 4-byte payload backpointer. Each additional guest adds another 4-byte tether. Rehosting adds no forwarding metadata and, when only one side has live guests, no additional cell.",
              "The minimum physical footprint attributable to one tethered hosting lineage is **16 bytes**: one 4-byte tether, one 8-byte physical anchor slot, and one 4-byte payload backpointer. Each additional guest adds another 4-byte tether. Merging two already-anchored hosting lineages reuses both existing cells: the destination cell remains the terminal payload anchor and the source cell becomes a forwarding anchor."
          )

          replace_once(
              "spec/memory.md",
              "Resolving a tether uses the chunk directory to locate the global anchor cell, reads the hosted payload's current segmented offset from that cell, resolves that offset through the same directory, then accesses the field. Because the pool never allocates cell identity `0`, resolving an untethered `0` traps rather than reading a live cell.",
              "Resolving a tether uses the chunk directory to locate its global anchor cell. If the cell forwards, resolution repeats with the target anchor until it reaches a payload anchor; it then resolves that cell's payload offset through the same directory and accesses the field. Forwarding chains cannot cycle because a move only redirects a superseded source identity toward the destination's terminal identity. The runtime may path-compress visited forwarding cells. Because the pool never allocates cell identity `0`, resolving an untethered `0` traps rather than reading a live cell."
          )

          replace_once(
              "spec/memory.md",
              "Moves, overwrites, and promotions update only the current payload offset in that same cell. Guests created before and after a promotion therefore follow an identical path, with no forwarding cells and no promotion-dependent extra hop.\n\nThe added cost over direct host access is one dependent anchor-cell load. Across repeated accesses through the same guest with no intervening move or overwrite, the compiler may resolve the host address once and reuse it.",
              "Ordinary overwrites and moves without an existing destination identity update one payload anchor. When two anchored hosting lineages merge, the destination anchor remains terminal and the source anchor forwards to it. Existing source guests therefore gain a forwarding hop, while destination guests and newly minted guests continue to use the terminal anchor directly. Copying or rebinding a guest through a forwarding tether resolves and stores the terminal identity, so an obsolete anchor identity cannot escape the lexical scope in which it was originally usable.\n\nThe added cost over direct host access is one dependent anchor-cell load for a terminal tether and one load per uncompressed forwarding hop for an older tether. Across repeated accesses through the same guest with no intervening move or overwrite, the compiler may resolve the host address once and reuse it; the runtime may also compress the chain."
          )

          old_45 = """### 4.5 Moves, overwrites, and rehosting keep one canonical anchor

An overwrite from a newly materialized value and a move from another host are distinct cases.

- **Ordinary overwrite:** if the destination hosting slot already has an anchor, the replacement payload inherits that backpointer and the cell is updated to the replacement's location. Existing destination guests therefore observe the new occupant. Destroying the old occupant does not return the cell, because the destination hosting lineage continues.
- **Move or rehosting with guests on only one side:** the anchor named by the live guest set becomes the destination's canonical anchor. If only the source has live guests, its anchor transfers to the destination. If only the destination has live guests, its anchor is preserved and the source's moved-from slot becomes another guest to it. Any noncanonical anchor left from an earlier, now-ended guest set is returned before the move completes. If neither side had live guests but the source slot remains readable in guest state, an anchor is allocated lazily for that new guest. The complete hosted representation is first relocated into destination-owned storage (§3.5, §3.7). The old source payload and backing-store bytes then cease to be live, the canonical cell is updated to the destination payload, the destination assumes teardown responsibility, and the source host-capable slot stores only its canonical tether in guest state.
- **Move or rehosting with live guests on both sides:** the program is ill-formed. The two guest sets name distinct stable identities, and a one-cell payload backpointer cannot preserve both through later moves without forwarding or guest enumeration. The compiler **MUST** reject the operation rather than recycle either referenced anchor. This restriction is determined from lexical guest liveness, not merely from whether a backpointer is nonzero.
- **Consumed untethered temporaries:** a temporary with no source slot that must remain readable may materialize into an untethered destination with backpointer `0` and allocate no anchor.

Anchor bookkeeping for every permitted operation is O(1) in the number of guests. Physical rehosting is proportional to the bytes or elements relocated and may update the canonical anchors of contained reference-type hosts, but it never enumerates guests. Promotion never creates a second live anchor path: it either preserves the sole live identity or is rejected. Source-scope and destination-scope guests therefore remain coherent after all later moves without repointing or forwarding.

This is also how a moved-from symbol stays readable: after a permitted move the host-capable symbol enters guest state and stores the canonical tether, so reads resolve through the anchor to the value's new home (see [`lifetimes.md`](lifetimes.md) §1.6).
"""
          new_45 = """### 4.5 Moves and overwrites may merge anchor identities

An overwrite from a newly materialized value and a move from another host are distinct cases.

- **Ordinary overwrite:** if the destination hosting slot already has a payload anchor, the replacement payload inherits that backpointer and the cell is updated to the replacement's location. Existing destination guests therefore observe the new occupant. Destroying the old occupant does not return the cell, because the destination hosting lineage continues.
- **Move into a fresh or untethered destination:** if the source already has a payload anchor, that cell follows the value into the destination and remains terminal. If no anchor exists but the moved-from source slot must remain readable as a guest, the runtime allocates one for the value after relocation. The source host-capable slot stores a tether to the terminal anchor.
- **Move into an anchored destination:** the destination payload anchor remains terminal, because the destination host identity survives replacement. If the source has a different payload anchor, the runtime changes that source cell into a forwarding anchor targeting the destination cell. Existing source guests continue through the forwarding cell; existing destination guests continue directly through the destination cell. The moved payload stores the destination identity in its backpointer, and the moved-from source slot stores that same terminal tether. If resolving both identities already reaches the same terminal anchor, no new forwarding edge is installed.
- **Consumed untethered temporaries:** a temporary with no source slot that must remain readable may materialize into an untethered destination with backpointer `0` and allocate no anchor.

The same rules apply recursively to reference-type hosts contained in a relocated representation. Their destination host identities survive replacement, and any distinct source identities forward to them. Anchor bookkeeping is O(1) for each merged host and never enumerates guests; physical rehosting remains proportional to the bytes, elements, and contained hosts relocated.

This is also how a moved-from symbol stays readable: after a move the host-capable symbol enters guest state and stores the terminal tether, so reads resolve through the anchor path to the value's new home (see [`lifetimes.md`](lifetimes.md) §1.6).
"""
          replace_once("spec/memory.md", old_45, new_45)

          old_46 = """### 4.6 Hosting-lifetime end returns the anchor

An anchor is returned to the global free-address stack when its **hosting lineage** ends. Overwriting only the current occupant does not end that lineage, because the host remains and existing guests follow the replacement. Rehosting transfers teardown responsibility to the destination host; the source slot is now a guest rather than a second host.

At the actual end of the hosting lineage, lexical scope rules guarantee that every guest capable of naming the anchor has already ceased to exist ([`lifetimes.md`](lifetimes.md) §1, [`concurrency.md`](concurrency.md) §4). The runtime may therefore recycle the slot immediately. No generation counter, delayed reuse, or ABA protection is required: a stale guest is not a representable program state.
"""
          new_46 = """### 4.6 Payload and forwarding anchors retire at different events

A terminal payload anchor is returned to the global free-address stack when its **hosting lineage** ends. Overwriting only the current occupant does not end that lineage, because the destination host remains and existing destination guests follow the replacement. Rehosting transfers teardown responsibility to the destination host.

A source anchor converted into a forwarder may still be named by guests created before the move, so it is not returned when the source stops hosting. Instead, the runtime associates it with the lexical scope of that former source host and returns it when that scope drains. Every guest that could already contain that obsolete identity is then dead by the ordinary scope rules. Copying or rebinding such a guest stores the terminal identity (§4.4), so the forwarding identity cannot newly escape its retirement scope.

These two retirement rules require neither reference counting nor guest enumeration. When either kind of anchor is returned, no live guest can still name it; immediate reuse therefore needs no generation counter, delayed reuse, or ABA protection.
"""
          replace_once("spec/memory.md", old_46, new_46)

          replace_once(
              "spec/memory.md",
              "A dangling or misdirected tether would require a guest to outlive its host, an anchor cell to move, or an anchor slot to be reused while an old guest remains. The model forbids all three. Scope checking proves the first impossible; the global pool gives each live hosting lineage one stable cell identity; and the same scope rule makes immediate slot reuse safe after teardown.",
              "A dangling or misdirected tether would require a guest to outlive the hosted value, a forwarding chain to cycle, or an anchor slot to be reused while an old guest remains. The model forbids all three. Scope checking prevents the first; forwarding always points from a superseded source identity toward the destination's terminal identity, preventing cycles; and the separate payload-anchor and forwarding-anchor retirement rules make slot reuse safe."
          )

          replace_once(
              "spec/memory.md",
              "The segmented encoding adds no meaningful arithmetic cost: the shift and mask that split a `u32` fold into machine addressing once the chunk base is loaded. Tether resolution pays one dependent anchor-cell load beyond direct host access. Rehosting adds no forwarding hop and no guest-enumeration cost; its physical relocation cost remains proportional to the representation moved.",
              "The segmented encoding adds no meaningful arithmetic cost: the shift and mask that split a `u32` fold into machine addressing once the chunk base is loaded. A terminal tether pays one dependent anchor-cell load beyond direct host access; an older identity pays one additional load per uncompressed forwarding hop. Rehosting never enumerates guests, and path compression makes repeated traversal of a chain amortized toward the terminal case. Physical relocation cost remains proportional to the representation moved."
          )

          replace_once(
              "spec/memory.md",
              "| Host-capable guest state | After rehosting, the old hosted bytes cease to be live and a slot declared as `T` stores the canonical tether as a guest while retaining enough storage to host another `T` later |",
              "| Host-capable guest state | After rehosting, the old hosted bytes cease to be live and a slot declared as `T` stores the terminal tether as a guest while retaining enough storage to host another `T` later |"
          )
          replace_once(
              "spec/memory.md",
              "| Anchor cell | One global-pool 8-byte physical slot per tethered hosting lineage; its 4-byte `u32` payload holds the current payload segmented offset |\n| Backpointer | Each hosted payload stores the stable `u32` identity of its anchor cell for move updates and tether minting; `0` means no cell has been allocated |\n| Anchor lifecycle | Lazily allocated on first guest; preserved across overwrite and rehosting; returned to the global free-address stack when the hosting lineage ends |\n| Anchor reuse safety | Immediate reuse is safe because lexical scope rules make a live stale guest unrepresentable |",
              "| Anchor cell | One global-pool 8-byte physical slot containing a `u32` target and a payload/forwarding kind; a forwarding cell targets another anchor |\n| Backpointer | Each hosted payload stores the terminal payload-anchor identity for move updates and tether minting; `0` means no cell has been allocated |\n| Anchor merging | Moving into an anchored destination preserves the destination anchor and converts a distinct source anchor into a forwarder; no guest is enumerated |\n| Anchor lifecycle | A payload anchor returns when its hosting lineage ends; a forwarding anchor returns when its former source-host scope drains |\n| Anchor reuse safety | Guest canonicalization and lexical scope rules ensure no live tether names a returned slot |"
          )

          old_lifetime = """### 1.10 A move needs live guests on at most one side

A move into an already-initialized host is rejected when **both** the source and the destination have live guests at that point. One hosting lineage keeps one anchor identity ([`memory.md`](memory.md) §4.5), and two live guest sets name two identities that the single canonical cell cannot carry forward. The compiler decides this from lexical guest liveness alone, the same way it decides guest assignment (§1.1).

```zane
a Node()
b Node()
ra &Node = a
b = a            // legal: only the source has a live guest; its anchor becomes canonical
ra:inspect()     // ra reaches the value in its new home, b
```

```zane
c Node()
d Node()
rc &Node = c
rd &Node = d
d = c            // ILLEGAL: both sides have live guests
rc:inspect()
rd:inspect()
```

Every permitted move stays O(1) in the number of guests, and the guests on the surviving side keep reaching the value in its new home (§1.6).

"""
          replace_once("spec/lifetimes.md", old_lifetime, "")
          replace_once(
              "spec/lifetimes.md",
              "| Move guest liveness | A move into an initialized host is rejected when both the source and the destination have live guests |\n",
              ""
          )

          replace_once(
              "spec/glossary.md",
              "- **Meaning:** A runtime cell whose `u32` payload holds the current segmented offset of one hosted object — the stable indirection point through which tethers resolve. It occupies one 8-byte slot in the runtime-global anchor pool, allocated when the first guest is created and returned to the pool's free-address stack when the hosting lineage ends. Its own segmented offset is the anchor identity that a whole hosting lineage keeps, across overwrite and rehosting.\n- **Why this name:** The cell is the fixed point that lets a moving object remain reachable: rehosting updates the cell while existing tethers keep pointing to it.",
              "- **Meaning:** An 8-byte runtime cell in the global anchor pool containing a `u32` target and a kind. A payload anchor targets a hosted object's segmented offset; a forwarding anchor targets another anchor after two hosting identities merge. A guest's `u32` tether names an anchor cell and follows forwarding cells until it reaches the terminal payload anchor.\n- **Why this name:** The cell is a stable point through which an older guest identity can remain attached to a moving value, either directly or through another anchor."
          )
          replace_once(
              "spec/glossary.md",
              "- **Meaning:** The internal representation of a guest: a `u32` segmented offset pointing at the host's anchor cell, not a raw pointer. The value `0` means no tether. A tether is a runtime mechanism, distinct from the source-facing `&T` guest (§3.33).",
              "- **Meaning:** The internal representation of a guest: a `u32` segmented offset pointing at an anchor cell, not a raw pointer. The cell may directly target the hosted payload or forward to another anchor. The value `0` means no tether. A tether is a runtime mechanism, distinct from the source-facing `&T` guest (§3.33)."
          )

          old_story = """The scope-local anchor region turned out to have a deeper problem than teardown. Promotion could leave source guests naming the old cell while destination guests named a new one; a later move had only one payload backpointer and could update only one path. Moving the old cell would merely force every existing guest to be repointed. The final design therefore takes anchors out of scopes entirely. One runtime-global pool grows through anchor-only pages, and one anchor identity follows a hosting lineage through overwrites and rehosting. Promotion first relocates the complete hosted representation into destination-owned storage and then updates that same cell rather than forwarding, recreating, or moving it.

That distinction matters for dynamic values. Rehosting copies the inline payload or handle into the destination host and relocates every owned backing store into an equal-size block or oversized span in the destination scope's dynamic region. The live contents move under their ordinary rules, including anchor updates for contained reference-type hosts; the old dynamic allocations are returned to the source scope's exact-size stacks. The old source payload bytes cease to be live, and its host-capable slot stores only the canonical tether as a guest. The anchor work remains O(1) in the number of guests, but the physical move is proportional to the bytes or elements relocated.

Each anchor occupies an 8-byte-aligned physical slot: four bytes hold the payload's segmented offset and four are reserved so every slot is addressable by the shared 8-byte-word encoding. The pool uses one free-address stack because all slots have the same size; allocation pops it before bumping the global frontier. Anchor pages remain mapped until runtime shutdown, even when wholly free, so an offset retained by the stack can never name an unmapped or repurposed page. The minimum physical machinery for one tethered lineage is therefore sixteen bytes: a four-byte tether, an eight-byte anchor slot, and a four-byte payload backpointer.

Individual teardown is the price of taking anchors out of scope arenas, but the host already provides the exact event needed. Overwriting an occupant preserves the lineage and its anchor; rehosting transfers teardown responsibility; only the end of the lineage returns the slot. Lexical lifetime rules prove that no guest can survive that event, so immediate slot reuse needs neither a generation counter nor delayed reclamation. A concurrent runtime may put thread-local caches in front of the same global pool without changing identity.

One canonical cell also exposes the only move the model cannot represent. If source and destination both have live guest sets, each set already names a different stable identity; preserving both through later moves would require forwarding or guest enumeration. Such a move is rejected. When only one side has live guests, its anchor becomes canonical. When neither does but the moved-from host-capable slot becomes a guest, the runtime creates the one anchor that new guest needs. This also sharpens the storage distinction: an explicit `&T` is guest-only and holds only a tether, while a slot declared `T` keeps its full storage after rehosting and may later host another `T`.
"""
          new_story = """The scope-local anchor region turned out to have a deeper problem than teardown. Promotion could leave source guests naming the old cell while destination guests named a new one; a later move had only one payload backpointer and could update only one path. Moving either cell would merely force every existing guest on that side to be repointed. The final design therefore takes anchors out of scopes entirely. One runtime-global pool grows through anchor-only pages, and anchor cells may target either a payload or another anchor.

That extra target kind makes identity merging mechanical. A move into an already-anchored destination destroys its old occupant but preserves the destination host identity, so the destination anchor remains the terminal payload anchor. The source anchor changes into a forwarding cell that targets it. Old source guests walk source anchor to destination anchor to payload; destination guests and newly created guests go directly to the destination anchor. Nothing in the source language exposes the chain, and no guest is enumerated or rewritten.

The same rule applies inside dynamic values. Rehosting copies the inline payload or handle into the destination host and relocates every owned backing store into an equal-size block or oversized span in the destination scope's dynamic region. Contained reference-type hosts merge their anchor identities in the same way. The old source payload bytes cease to be live, and its host-capable slot stores the terminal tether as a guest. Anchor work remains O(1) per merged host, while the physical move is proportional to the bytes, elements, and contained hosts relocated.

Each anchor occupies an 8-byte-aligned physical slot: four bytes hold a target segmented offset and four identify whether that target is a payload or another anchor. The pool uses one free-address stack because all slots have the same size; allocation pops it before bumping the global frontier. Anchor pages remain mapped until runtime shutdown, even when wholly free, so an offset retained by the stack can never name an unmapped or repurposed page. The minimum physical machinery for one directly tethered lineage remains sixteen bytes: a four-byte tether, an eight-byte anchor slot, and a four-byte payload backpointer.

The chain has a natural direction. A superseded source identity always forwards toward the destination identity, and moves only target the same or a higher scope, so a forwarding edge never points toward a shorter-lived host. Resolution may compress the path. Copying or rebinding an old guest stores the terminal identity rather than propagating the obsolete one, which means a forwarding anchor cannot newly escape the lexical scope that originally contained its source host.

That gives the two cell kinds different retirement events. A terminal payload anchor returns when the final hosting lineage ends. A forwarding anchor remains only until its former source-host scope drains, when every old guest that could still contain that identity is dead. Neither case requires reference counting or guest enumeration, and both permit immediate free-stack reuse. The earlier restriction on moves with guests on both sides disappears entirely: the two identities simply become a chain. An explicit `&T` remains guest-only and holds only a tether, while a slot declared `T` keeps its full storage after rehosting and may later host another `T`.
"""
          replace_once("stories/memory.md", old_story, new_story)
          PY


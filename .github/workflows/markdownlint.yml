# Runs the same check the README and CLAUDE.md tell contributors to run locally.
#
# This file deliberately states no rules of its own: markdownlint-cli2 discovers
# the committed `.markdownlint.jsonc`, which stays the single source of truth for
# which rules are on. Keep it that way — a rule set repeated here would drift.
name: markdownlint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Devbox tools (latest Devbox CLI)
        uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          enable-cache: true

      # Keep recursive globs and the committed Markdownlint configuration.
      - run: devbox run lint

name: Apply memory spec correction

on:
  push:
    branches:
      - agent/fix-host-overwrite-reuse

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-host-overwrite-reuse

      - name: Correct host overwrite semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path("spec/memory.md")
          text = path.read_text()
          old = "Within a scope's arena, allocation is a single frontier bump — no size classes, no free list, no coalescing. Hosts are not reclaimed one at a time: a host that dies or is overwritten mid-scope (§2.2) becomes dead space in the arena until the scope drains. Reclamation is bulk. When the scope drains — after all its spawned work completes ([`concurrency.md`](concurrency.md) §4.1) — the runtime unmaps the scope's chunks and every byte the scope held is released at once, with no per-object teardown pass threaded through the exit. Logical destruction timing is unchanged — a host dies when its host, container, or scope does ([`lifetimes.md`](lifetimes.md) §2.1); it is the *memory* that is reclaimed together at drain."
          new = "Within a scope's arena, allocation is a single frontier bump — no size classes, no free list, no coalescing. A host is a fixed-size storage slot: overwriting it destroys the current occupant and initializes the replacement directly in the same slot (§2.2, §3.7). Overwriting therefore consumes no additional arena space.\n\nReclamation is bulk. When the scope drains — after all its spawned work completes ([`concurrency.md`](concurrency.md) §4.1) — the runtime unmaps the scope's chunks and every byte the scope held is released at once, with no reachability scan or per-object memory-reclamation pass threaded through the exit. Anything that escaped the scope was already promoted into its destination scope's arena (§3.5), so no surviving object remains in the drained arena. Logical destruction timing is unchanged — a host dies when its host, container, or scope does ([`lifetimes.md`](lifetimes.md) §2.1); it is the *memory* that is released together at drain."
          if text.count(old) != 1:
              raise SystemExit("expected §3.2 text not found exactly once")
          path.write_text(text.replace(old, new))

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-memory-overwrite.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/memory.md .github/workflows/fix-memory-overwrite.yml
          git commit -m "clarify host overwrite slot reuse"
          git push
